name: macOS

on:
  pull_request:
    paths-ignore: [ "**.md" ]
  push:
    branches: [main]
    paths-ignore: [ "**.md" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rspec:
    name: RSpec (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec
